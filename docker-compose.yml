version: '3.8'

services:
  nats:
    image: nats:latest
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring
      - "6222:6222"   # Cluster routes
    command: 
      - "-js"         # Enable JetStream
      - "-sd"         # Store directory
      - "/data"
      - "-m"          # Enable monitoring
      - "8222"
    volumes:
      - nats-data:/data

volumes:
  nats-data: